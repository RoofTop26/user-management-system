<svg xmlns="http://www.w3.org/2000/svg" width="940" height="706" viewBox="0 0 940 706"><defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#222}.t{font-weight:bold;font-size:13px}.s{font-size:11px;fill:#555}.k{fill:#555;font-size:11px}.b{fill:#fff;stroke:#333;stroke-width:1.2}.l{stroke:#333;stroke-width:1.2;fill:none}.d{stroke:#333;stroke-width:1.2;fill:none;stroke-dasharray:5 4}</style></defs><rect width="940" height="706" fill="#fff"/><text x="450" y="34" text-anchor="middle" class="t" style="font-size:18px">ERD - Cơ sở dữ liệu hệ thống e-commerce</text><rect x="40" y="70" width="400" height="108" class="b"/><rect x="40" y="70" width="400" height="30" fill="#cfe2f3" stroke="#333" stroke-width="1.2"/><text x="240.0" y="90" text-anchor="middle" class="t">admins</text><line x1="40" y1="100" x2="440" y2="100" stroke="#ccc"/><text x="50" y="118" class="t" style="font-size:12px">id</text><text x="180" y="118">BIGINT</text><text x="295" y="118" class="k">PK, AUTO_INCREMENT</text><line x1="40" y1="126" x2="440" y2="126" stroke="#ccc"/><text x="50" y="144">username</text><text x="180" y="144">VARCHAR(255)</text><text x="295" y="144" class="k"></text><line x1="40" y1="152" x2="440" y2="152" stroke="#ccc"/><text x="50" y="170">password</text><text x="180" y="170">VARCHAR(255)</text><text x="295" y="170" class="k"></text><rect x="40" y="228" width="400" height="264" class="b"/><rect x="40" y="228" width="400" height="30" fill="#cfe2f3" stroke="#333" stroke-width="1.2"/><text x="240.0" y="248" text-anchor="middle" class="t">users</text><line x1="40" y1="258" x2="440" y2="258" stroke="#ccc"/><text x="50" y="276" class="t" style="font-size:12px">id</text><text x="180" y="276">BIGINT</text><text x="295" y="276" class="k">PK, AUTO_INCREMENT</text><line x1="40" y1="284" x2="440" y2="284" stroke="#ccc"/><text x="50" y="302">username</text><text x="180" y="302">VARCHAR(255)</text><text x="295" y="302" class="k">UNIQUE</text><line x1="40" y1="310" x2="440" y2=