78" stroke="#ccc"/><text x="510" y="196">status</text><text x="640" y="196">VARCHAR(255)</text><text x="755" y="196" class="k">ACTIVE / INACTIVE</text><line x1="500" y1="204" x2="900" y2="204" stroke="#ccc"/><text x="510" y="222">createdAt</text><text x="640" y="222">DATETIME(6)</text><text x="755" y="222" class="k"></text><line x1="500" y1="230" x2="900" y2="230" stroke="#ccc"/><text x="510" y="248">updatedAt</text><text x="640" y="248">DATETIME(6)</text><text x="755" y="248" class="k"></text><rect x="500" y="376" width="400" height="290" class="b"/><rect x="500" y="376" width="400" height="30" fill="#cfe2f3" stroke="#333" stroke-width="1.2"/><text x="700.0" y="396" text-anchor="middle" class="t">products</text><line x1="500" y1="406" x2="900" y2="406" stroke="#ccc"/><text x="510" y="424" class="t" style="font-size:12px">id</text><text x="640" y="424">BIGINT</text><text x="755" y="424" class="k">PK, AUTO_INCREMENT</text><line x1="500" y1="432" x2="900" y2="432" stroke="#ccc"/><text x="510" y="450">name</text><text x="640" y="450">VARCHAR(255)</text><text x="755" y="450" class="k"></text><line x1="500" y1="458" x2="900" y2="458" stroke="#ccc"/><text x="510" y="476">description</text><text x="640" y="476">VARCHAR(255)</text><text x="755" y="476" class="k">NULL</text><line x1="500" y1="484" x2="900" y2="484" stroke="#ccc"/><text x="510" y="502">price</text><text x="640" y="502">DECIMAL(38,2)</text><text x="755" y="502" class="k">BigDecimal</text><line x1="500" y1="510" x2="900" y2="510" stroke="#ccc"/><text x="510" y="528">stock</text><text x="640" y="528">INT</text><text x="755" y="528" class="k"></text><line x1="500" y1="536" x2="900" y2="536" stroke="#ccc"/><text x="510" y="554">image_url</text><text x="640" y="554">VARCHAR(255)</text><text x="755" y="554" class="k">NULL</text><line x1="500" y1="562" x2="900" y2="562" stroke="#ccc"/><text x="510" y="580">status</text><text x="640" y="580">VARCHAR(255)</text><text x="755" y="580" class="k">ACTIVE / INACTIVE</text><line x1="500" y1="588" x2="900" y2="588" stroke="#ccc"/><text x="510" y="606">category_id</text><text x="640" y="606">BIGINT</text><text x="755" y="606" class="k">FK → categories.id</text><line x1="500" y1="614" x2="900" y2="614" stroke="#ccc"/><text x="510" y="632">createdAt</text><text x="640" y="632">DATETIME(6)</text><text x="755" y="632" class="k"></text><line x1="500" y1="640" x2="900" y2="640" stroke="#ccc"/><text x="510" y="658">updatedAt</text><text x="640" y="658">DATETIME(6)</text><text x="755" y="658" class="k"></text><line x1="700" y1="256" x2="700" y2="376" class="l"/><path d="M700,362 L688,376 M700,362 L712,376 M700,362 V376" class="l"/><line x1="688" y1="270" x2="712" y2="270" class="l"/><text x="714" y="286" class="t">1</text><text x="716" y="358" class="t">N</text><text x="724" y="320.0">1 category → nhiều product</text><text x="40" y="532" class="s">Chú thích: PK = khóa chính, FK = khóa ngoại, UNIQUE = không trùng, NULL = cho phép rỗng.</text><text x="40" y="550" class="s">categories và products là bảng MỚI. Quan hệ 1-N: khóa ngoại category_id nằm ở bảng products.</text></svg>
